version: 2

project_name: metago

builds:
  - id: metago
    main: ./cmd/metago
    binary: metago
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

# コミットメッセージは日本語で運用しているため、そのまま並べても英語話者に伝わらず、
# 件名の列挙は破壊的変更の警告にもならない。リリース後にgh release editで英語のノートを書く。
changelog:
  disable: true
